<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Wedding</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@500;700&family=Great+Vibes&family=Cormorant+Garamond:ital,wght@1,600&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --gold: #f5c518;
            --gold2: #ffdd55;
            --dark: #080412;
            --pink: #f472b6;
            --pink2: #fbcfe8;
            --pink3: #fce7f3;
            --rose: #e879a0;
            --blush: rgba(255, 220, 240, 0.18);
            --blush2: rgba(255, 182, 218, 0.32);
        }

        body {
            font-family: 'Orbitron', monospace;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            background: var(--dark);
        }

        /* SLIDESHOW */
        #slideshow {
            position: fixed;
            inset: 0;
            z-index: 0;
        }

        .slide {
            position: absolute;
            inset: 0;
            /* background-size: cover; */
            background-position: center;
            opacity: 0;
            transition: opacity 1.8s ease;
        }

        .slide.active {
            opacity: 1;
        }

        #overlay {
            position: fixed;
            inset: 0;
            z-index: 1;
            background: radial-gradient(ellipse at center, rgba(255, 220, 235, 0.08) 0%, rgba(10, 5, 20, 0.32) 100%);
        }

        /* MAIN */
        #main {
            position: fixed;
            inset: 0;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 30px;
        }

        .title-block {
            text-align: center;
        }

        .title-block h1 {
            font-size: clamp(36px, 7vw, 80px);
            font-weight: 900;
            letter-spacing: 8px;
            color: #fff;
            text-shadow: 0 0 30px rgba(244, 114, 182, 0.9), 0 0 70px rgba(244, 114, 182, 0.4), 0 2px 8px rgba(180, 40, 90, 0.3);
        }

        .title-block .sub {
            font-family: 'Great Vibes', cursive;
            font-size: clamp(28px, 4.5vw, 56px);
            letter-spacing: 3px;
            color: #fff;
            margin-top: 8px;
            text-shadow: 0 0 20px rgba(244, 114, 182, 0.8), 0 0 50px rgba(244, 114, 182, 0.3), 0 2px 6px rgba(120, 20, 60, 0.35);
        }

        /* MACHINE FRAME */
        #machine {
            /* background: linear-gradient(160deg, rgba(255, 220, 240, 0.22), rgba(255, 255, 255, 0.15)); */
            /* border: 2px solid rgba(255, 255, 255, 0.45); */
            border-radius: 40px;
            padding: 72px 30px 64px;
            /* box-shadow: 0 0 60px rgba(244, 114, 182, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.5); */
            display: flex;
            flex-direction: column;
            align-items: center;
            /* gap: 40px; */
            /* backdrop-filter: blur(18px) saturate(1.4); */
            -webkit-backdrop-filter: blur(18px) saturate(1.4);
        }

        .deco-line {
            width: 520px;
            max-width: 90vw;
            height: 1.5px;
            background: linear-gradient(90deg, transparent, rgba(244, 114, 182, 0.7), rgba(255, 255, 255, 0.9), rgba(244, 114, 182, 0.7), transparent);
            box-shadow: 0 0 8px rgba(244, 114, 182, 0.3);
        }

        /* SLOTS ROW */
        #slots {
            display: flex;
            gap: 18px;
            align-items: flex-end;
            flex-wrap: wrap;
            justify-content: center;
        }

        /* DRUM WRAPPER */
        .drum-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .drum-lbl {
            font-family: 'Rajdhani', sans-serif;
            font-size: 13px;
            letter-spacing: 3px;
            color: rgba(232, 121, 160, 0.75);
            text-transform: uppercase;
        }

        /* DRUM VIEWPORT */
        .drum {
            width: clamp(100px, 11vw, 200px);
            height: clamp(130px, 14vw, 150px);
            position: relative;
            border-radius: 22px;
            overflow: hidden;
            background: rgba(255, 230, 242, 0.35);
            border: 1.5px solid rgba(255, 255, 255, 0.5);
            box-shadow: inset 0 2px 12px rgba(244, 114, 182, 0.12), 0 4px 20px rgba(232, 121, 160, 0.15);
            transition: border-color 0.3s, box-shadow 0.3s;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        }

        /* gradient masks — cylinder illusion */
        .drum::before,
        .drum::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
        }

        .drum::before {
            top: 0;
            height: 38%;
            background: linear-gradient(to bottom, rgba(255, 220, 240, 0.75) 0%, rgba(255, 220, 240, 0.3) 60%, transparent 100%);
        }

        .drum::after {
            bottom: 0;
            height: 38%;
            background: linear-gradient(to top, rgba(255, 220, 240, 0.75) 0%, rgba(255, 220, 240, 0.3) 60%, transparent 100%);
        }

        /* highlight band */
        .drum-hl {
            position: absolute;
            left: 0;
            right: 0;
            z-index: 11;
            pointer-events: none;
            top: 50%;
            transform: translateY(-50%);
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(244, 114, 182, 0.8), rgba(255, 255, 255, 0.9), rgba(244, 114, 182, 0.8), transparent);
            box-shadow: 0 0 10px rgba(244, 114, 182, 0.6);
        }

        /* the scrolling strip */
        .drum-inner {
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            will-change: transform;
        }

        .drum-digit {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Orbitron', monospace;
            font-weight: 900;
            font-size: clamp(64px, 8vw, 96px);
            color: rgba(255, 255, 255, 0.6);
            flex-shrink: 0;
            transition: color 0.2s;
            text-shadow: 0 1px 4px rgba(180, 60, 100, 0.2);
        }

        .drum-digit.lit {
            color: #c2185b;
            text-shadow: 0 0 18px rgba(244, 114, 182, 0.7), 0 0 40px rgba(251, 207, 232, 0.5);
        }

        /* spinning state */
        .drum.spinning {
            border-color: rgba(244, 114, 182, 0.8);
            box-shadow: 0 0 22px rgba(244, 114, 182, 0.4), 0 4px 20px rgba(232, 121, 160, 0.2), inset 0 2px 8px rgba(244, 114, 182, 0.1);
        }

        .drum.spinning .drum-hl {
            background: linear-gradient(90deg, transparent, rgba(244, 114, 182, 0.9), rgba(255, 255, 255, 1), rgba(244, 114, 182, 0.9), transparent);
            box-shadow: 0 0 12px rgba(244, 114, 182, 0.8);
        }

        /* stopped state */
        .drum.stopped {
            border-color: rgba(194, 24, 91, 0.7);
            box-shadow: 0 0 28px rgba(244, 114, 182, 0.5), 0 4px 20px rgba(232, 121, 160, 0.25), inset 0 2px 8px rgba(244, 114, 182, 0.1);
            animation: drumPop 0.35s ease;
        }

        .drum.stopped .drum-hl {
            background: linear-gradient(90deg, transparent, rgba(194, 24, 91, 0.8), rgba(255, 255, 255, 1), rgba(194, 24, 91, 0.8), transparent);
            box-shadow: 0 0 14px rgba(194, 24, 91, 0.7);
        }

        @keyframes drumPop {
            0% {
                transform: scale(1)
            }

            40% {
                transform: scale(1.08)
            }

            75% {
                transform: scale(0.96)
            }

            100% {
                transform: scale(1)
            }
        }

        .drum-sep {
            font-family: 'Orbitron', monospace;
            font-weight: 900;
            font-size: 26px;
            color: rgba(232, 121, 160, 0.6);
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(244, 114, 182, 0.4);
        }

        /* SPIN BUTTON */
        #spin-btn {
            font-family: 'Orbitron', monospace;
            font-weight: 900;
            font-size: 15px;
            letter-spacing: 4px;
            padding: 18px 64px;
            color: #fff;
            background: linear-gradient(135deg, #f472b6, #e879a0, #c2185b);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 32px rgba(244, 114, 182, 0.5), 0 2px 0 rgba(180, 40, 90, 0.3);
            transition: transform 0.15s, box-shadow 0.15s, filter 0.15s;
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
        }

        #spin-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0.28), transparent);
            border-radius: inherit;
        }

        #spin-btn:hover {
            transform: scale(1.06);
            box-shadow: 0 10px 52px rgba(244, 114, 182, 0.65);
            filter: brightness(1.08);
        }

        #spin-btn:active {
            transform: scale(0.97);
        }

        #spin-btn:disabled {
            filter: brightness(0.5) saturate(0.3);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* RESULT */
        #result {
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: clamp(16px, 2vw, 22px);
            letter-spacing: 4px;
            color: rgba(180, 60, 100, 0.8);
            min-height: 28px;
            text-align: center;
        }

        #result.show {
            color: #c2185b;
            text-shadow: 0 0 16px rgba(244, 114, 182, 0.6), 0 0 32px rgba(251, 207, 232, 0.4);
            animation: rFade 0.5s ease;
        }

        @keyframes rFade {
            from {
                opacity: 0;
                transform: translateY(6px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        /* MODAL */
        #modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: rgba(0, 0, 0, 0.82);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #modal {
            background: linear-gradient(155deg, rgba(16, 6, 38, 0.99), rgba(8, 3, 22, 0.99));
            border: 1.5px solid rgba(245, 197, 24, 0.32);
            border-radius: 24px;
            padding: 44px 50px;
            text-align: center;
            color: #fff;
            min-width: 340px;
            max-width: 92vw;
            box-shadow: 0 0 80px rgba(245, 197, 24, 0.1), 0 24px 80px rgba(0, 0, 0, 0.6);
        }

        .m-icon {
            font-size: 50px;
            margin-bottom: 10px;
            line-height: 1;
        }

        #modal h2 {
            font-family: 'Orbitron', monospace;
            font-size: 22px;
            font-weight: 900;
            color: var(--gold);
            letter-spacing: 2px;
            margin-bottom: 8px;
            text-shadow: 0 0 18px rgba(245, 197, 24, 0.6);
        }

        #modal p {
            font-family: 'Rajdhani', sans-serif;
            font-size: 15px;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 22px;
            line-height: 1.65;
        }

        .hint-row {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 22px;
        }

        .hint-chip {
            font-family: 'Rajdhani', sans-serif;
            font-size: 13px;
            font-weight: 600;
            background: rgba(245, 197, 24, 0.07);
            border: 1px solid rgba(245, 197, 24, 0.22);
            border-radius: 30px;
            padding: 5px 15px;
            color: rgba(245, 197, 24, 0.65);
            cursor: pointer;
            transition: all 0.18s;
        }

        .hint-chip:hover {
            background: rgba(245, 197, 24, 0.16);
            color: var(--gold);
            border-color: rgba(245, 197, 24, 0.55);
        }

        #limit-input {
            width: 100%;
            padding: 15px 18px;
            font-family: 'Orbitron', monospace;
            font-size: 26px;
            text-align: center;
            font-weight: 900;
            background: rgba(255, 255, 255, 0.05);
            border: 1.5px solid rgba(245, 197, 24, 0.38);
            border-radius: 12px;
            color: var(--gold);
            outline: none;
            margin-bottom: 16px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        #limit-input:focus {
            border-color: rgba(245, 197, 24, 0.85);
            box-shadow: 0 0 18px rgba(245, 197, 24, 0.22);
        }

        #limit-input::placeholder {
            color: rgba(245, 197, 24, 0.2);
            font-size: 15px;
            font-weight: 400;
        }

        #start-btn {
            width: 100%;
            padding: 15px;
            font-family: 'Orbitron', monospace;
            font-size: 14px;
            font-weight: 900;
            letter-spacing: 3px;
            background: linear-gradient(135deg, #f5c518, #d09810);
            border: none;
            border-radius: 12px;
            color: #09050f;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.15s;
            text-transform: uppercase;
            box-shadow: 0 6px 24px rgba(245, 197, 24, 0.32);
        }

        #start-btn:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }

        #start-btn:active {
            transform: scale(0.98);
        }

        #merr {
            font-family: 'Rajdhani', sans-serif;
            color: #ff7878;
            font-size: 13px;
            margin-top: 10px;
            min-height: 18px;
            font-weight: 600;
        }

        /* RESULT POPUP */
        #result-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 200;
            background: rgba(60, 10, 30, 0.55);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            align-items: center;
            justify-content: center;
            animation: rOverlayIn 0.4s ease;
        }

        #result-overlay.show {
            display: flex;
        }

        @keyframes rOverlayIn {
            from {
                opacity: 0
            }

            to {
                opacity: 1
            }
        }

        #result-popup {
            background: linear-gradient(155deg, rgba(255, 235, 248, 0.92), rgba(255, 255, 255, 0.88));
            border: 2px solid rgba(255, 255, 255, 0.7);
            border-radius: 36px;
            padding: 60px 70px 50px;
            text-align: center;
            max-width: 90vw;
            box-shadow: 0 0 80px rgba(244, 114, 182, 0.4), 0 30px 80px rgba(180, 40, 90, 0.2);
            backdrop-filter: blur(20px);
            animation: rPopIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes rPopIn {
            from {
                opacity: 0;
                transform: scale(0.7)
            }

            to {
                opacity: 1;
                transform: scale(1)
            }
        }

        #result-popup .rp-icon {
            font-size: 64px;
            line-height: 1;
            margin-bottom: 16px;
        }

        #result-popup .rp-title {
            font-family: 'Great Vibes', cursive;
            font-size: clamp(28px, 5vw, 52px);
            color: #c2185b;
            text-shadow: 0 0 20px rgba(244, 114, 182, 0.5);
            margin-bottom: 20px;
        }

        #result-popup .rp-number {
            font-family: 'Orbitron', monospace;
            font-weight: 900;
            font-size: clamp(48px, 9vw, 110px);
            color: #c2185b;
            text-shadow: 0 0 30px rgba(244, 114, 182, 0.6), 0 0 70px rgba(244, 114, 182, 0.2);
            letter-spacing: 6px;
            margin-bottom: 32px;
            line-height: 1.1;
        }

        #result-popup .rp-close {
            font-family: 'Orbitron', monospace;
            font-weight: 900;
            font-size: 14px;
            letter-spacing: 3px;
            padding: 16px 50px;
            color: #fff;
            background: linear-gradient(135deg, #f472b6, #c2185b);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 28px rgba(244, 114, 182, 0.45);
            transition: transform 0.15s, filter 0.15s;
        }

        #result-popup .rp-close:hover {
            transform: scale(1.06);
            filter: brightness(1.1);
        }

        #result-popup .rp-close:active {
            transform: scale(0.96);
        }
    </style>
</head>

<body>
    <div id="slideshow"></div>
    <div id="overlay"></div>

    <div id="main">
        <div class="title-block">
            <h1>HAPPY WEDDING</h1>
            <div class="sub">Minh Trường ♥ Thanh Ngọc</div>
        </div>
        <div id="machine">
            <div class="deco-line"></div>
            <div id="slots"></div>
            <div class="deco-line"></div>
        </div>
        <button id="spin-btn" onclick="startSpin()">▶ QUAY NGAY</button>
        <div id="result"></div>
    </div>

    <!-- RESULT POPUP -->
    <div id="result-overlay">
        <div id="result-popup">
            <div class="rp-icon">🎉</div>
            <div class="rp-title">Kết Quả May Mắn</div>
            <div class="rp-number" id="rp-number"></div>
            <button class="rp-close" onclick="closeResult()">✓ ĐÓNG</button>
        </div>
    </div>

    <div id="modal-overlay">
        <div id="modal">
            <div class="m-icon">🎯</div>
            <h2>THIẾT LẬP</h2>
            <p>Nhập số giới hạn tối đa.<br>Số chữ số = số ô quay.</p>
            <div class="hint-row">
                <span class="hint-chip" onclick="sh(9)">9 → 1 ô</span>
                <span class="hint-chip" onclick="sh(99)">99 → 2 ô</span>
                <span class="hint-chip" onclick="sh(999)">999 → 3 ô</span>
                <span class="hint-chip" onclick="sh(9999)">9999 → 4 ô</span>
                <span class="hint-chip" onclick="sh(99999)">99999 → 5 ô</span>
            </div>
            <input id="limit-input" type="number" placeholder="Nhập số..." min="1" max="99999999" autofocus
                onkeydown="if(event.key==='Enter')go()" />
            <button id="start-btn" onclick="go()">✓ XÁC NHẬN &amp; BẮT ĐẦU</button>
            <div id="merr"></div>
        </div>
    </div>

    <script>
        const IMGS = [
            '1.jpg',
            '2.jpg',
            '3.jpg',
            '4.jpg',
        ];
        let numDigits = 3, isSpinning = false, drums = [];

        // ─── Slideshow
        (function () {
            const ss = document.getElementById('slideshow');
            IMGS.forEach((u, i) => { const d = document.createElement('div'); d.className = 'slide' + (i === 0 ? ' active' : ''); d.style.backgroundImage = `url('${u}')`; ss.appendChild(d); });
            let c = 0; setInterval(() => { const s = document.querySelectorAll('.slide'); s[c].classList.remove('active'); c = (c + 1) % s.length; s[c].classList.add('active'); }, 5000);
        })();

        function closeResult() {
            document.getElementById('result-overlay').classList.remove('show');
        }

        function sh(v) { document.getElementById('limit-input').value = v; document.getElementById('merr').textContent = ''; }

        function go() {
            const v = parseInt(document.getElementById('limit-input').value), e = document.getElementById('merr');
            if (!v || isNaN(v) || v < 1) { e.textContent = '⚠ Nhập số nguyên dương hợp lệ.'; return; }
            if (v > 99999999) { e.textContent = '⚠ Tối đa 8 chữ số.'; return; }
            numDigits = v.toString().length;
            document.getElementById('modal-overlay').style.display = 'none';
            buildDrums();
        }

        // ─── Build Drums
        function buildDrums() {
            const c = document.getElementById('slots'); c.innerHTML = ''; drums = [];
            const REPS = 80; // enough height for long spins

            for (let i = 0; i < numDigits; i++) {
                if (i > 0) { const sep = document.createElement('div'); sep.className = 'drum-sep'; sep.textContent = '-'; c.appendChild(sep); }

                const wrap = document.createElement('div'); wrap.className = 'drum-wrap';
                const lbl = document.createElement('div'); lbl.className = 'drum-lbl'; lbl.textContent = '';
                const drum = document.createElement('div'); drum.className = 'drum'; drum.id = 'drum-' + i;
                const hl = document.createElement('div'); hl.className = 'drum-hl';
                const inner = document.createElement('div'); inner.className = 'drum-inner'; inner.id = 'inner-' + i;

                for (let r = 0; r < REPS; r++) for (let d = 0; d < 10; d++) {
                    const el = document.createElement('div'); el.className = 'drum-digit'; el.textContent = d; inner.appendChild(el);
                }

                drum.appendChild(inner); drum.appendChild(hl);
                wrap.appendChild(lbl); wrap.appendChild(drum);
                c.appendChild(wrap);
                drums.push({ inner, raf: null, offset: 0, speed: 0, stopped: false, digitH: 0 });
            }

            // measure after paint
            requestAnimationFrame(() => {
                drums.forEach((ds, i) => {
                    const first = ds.inner.querySelector('.drum-digit');
                    ds.digitH = first ? first.offsetHeight : 100;
                    ds.inner.style.height = (ds.digitH * 10 * 80) + 'px'; // set explicit height
                    // random starting position
                    ds.offset = Math.floor(Math.random() * 10) * ds.digitH + ds.digitH * 10 * 10;
                    ds.inner.style.transform = `translateY(-${ds.offset}px)`;
                });
            });
        }

        // ─── Spin all drums (free running)
        function runDrum(idx) {
            const ds = drums[idx];
            if (ds.stopped) return;
            ds.offset += ds.speed;
            // keep in bounds (wrap mod)
            const total = ds.digitH * 10 * 80;
            if (ds.offset > total - ds.digitH * 10 * 5) ds.offset -= ds.digitH * 10 * 40;
            ds.inner.style.transform = `translateY(-${ds.offset}px)`;
            ds.raf = requestAnimationFrame(() => runDrum(idx));
        }

        // ─── Ease-out decelerate + snap to digit
        function stopDrum(idx, targetDigit, onDone) {
            const ds = drums[idx];
            cancelAnimationFrame(ds.raf);
            ds.stopped = true;

            const drum = document.getElementById('drum-' + idx);
            const cycleH = ds.digitH * 10;

            // current scroll within a 10-digit cycle
            let cur = ds.offset % cycleH;
            let tgt = targetDigit * ds.digitH;
            let travel = tgt - cur;
            if (travel < ds.digitH * 2) travel += cycleH; // ensure at least 2 digit scroll forward
            // add drama: 3-5 extra full cycles
            travel += cycleH * (3 + Math.floor(Math.random() * 3));

            const startOff = ds.offset, endOff = ds.offset + travel;
            const dur = 1000 + Math.random() * 500;
            const t0 = performance.now();

            function easeOutQuint(x) { return 1 - Math.pow(1 - x, 5); }

            function tick(now) {
                const t = Math.min((now - t0) / dur, 1);
                const e = easeOutQuint(t);
                ds.offset = startOff + (endOff - startOff) * e;
                ds.inner.style.transform = `translateY(-${ds.offset}px)`;
                if (t < 1) { ds.raf = requestAnimationFrame(tick); }
                else {
                    ds.offset = endOff;
                    ds.inner.style.transform = `translateY(-${ds.offset}px)`;
                    drum.className = 'drum stopped';
                    // light up center digit
                    const all = ds.inner.querySelectorAll('.drum-digit');
                    all.forEach(d => d.classList.remove('lit'));
                    const absIdx = Math.round(ds.offset / ds.digitH);
                    if (all[absIdx]) all[absIdx].classList.add('lit');
                    if (onDone) onDone();
                }
            }
            ds.raf = requestAnimationFrame(tick);
        }

        // ─── MAIN SPIN
        function startSpin() {
            if (isSpinning) return;
            isSpinning = true;
            const btn = document.getElementById('spin-btn');
            btn.disabled = true; btn.textContent = '⏳ ĐANG QUAY...';
            const res = document.getElementById('result');
            res.textContent = ''; res.className = '';

            const finalDigits = drums.map(() => Math.floor(Math.random() * 10));

            // Start all spinning
            drums.forEach((ds, i) => {
                const drum = document.getElementById('drum-' + i);
                drum.className = 'drum spinning';
                ds.stopped = false;
                ds.speed = 26 + i * 1.5; // slight speed variety
                runDrum(i);
            });

            // Stop right → left
            const BASE = 1500, STEP = 600;
            for (let i = numDigits - 1; i >= 0; i--) {
                (function (idx) {
                    setTimeout(() => {
                        stopDrum(idx, finalDigits[idx], () => {
                            if (idx === 0) {
                                setTimeout(() => {
                                    isSpinning = false;
                                    btn.disabled = false; btn.textContent = '▶ QUAY LẠI';
                                    res.textContent = '🎉  KẾT QUẢ:  ' + finalDigits.join(' - ');
                                    res.className = 'show';
                                    // Show popup
                                    document.getElementById('rp-number').textContent = finalDigits.join('   ');
                                    document.getElementById('result-overlay').classList.add('show');
                                }, 350);
                            }
                        });
                    }, BASE + (numDigits - 1 - idx) * STEP);
                })(i);
            }
        }
    </script>
</body>
